# ---- Gradle ----
# 固定 UTF-8 + 英文诊断信息：中文 Windows 上 javac 默认用 GBK 输出，
# 在 CI / 复制粘贴日志时容易变乱码，这里统一掉。
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true
# Loom 与 configuration-cache 在部分版本组合下不稳，先关掉
org.gradle.configuration-cache=false

# ---- Fabric / Minecraft（版本号均已对照官方 Maven 元数据核实）----
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.16.14
fabric_api_version=0.92.12+1.20.1
# 仅编译期用（ModMenu 的模组列表入口）；运行期没装也不影响
modmenu_version=7.2.2

# ---- Mod 自身 ----
mod_version=0.12.50
maven_group=dev.clouddisc
archives_base_name=clouddisc
