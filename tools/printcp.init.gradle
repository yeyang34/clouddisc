// 临时 init 脚本（不修改仓库里的 build.gradle）：把 Minecraft 完整运行期 classpath 打出来。
// 离线自检（tools\OcclusionWalkTest.java）要用它拿到 classpath —— 那条路径需要真实的
// VoxelShape/Box，但**不需要启动游戏**。
//
// 用法： gradlew -I tools\printcp.init.gradle :printRuntimeCp -q
//       输出里 CPSTART / CPEND 之间的那一行就是完整 classpath（含 Minecraft 与全部依赖库）。
allprojects { p ->
    p.afterEvaluate {
        if (p.plugins.hasPlugin('java')) {
            p.tasks.register('printRuntimeCp') {
                doLast {
                    println 'CPSTART'
                    println p.sourceSets.main.runtimeClasspath.asPath
                    println 'CPEND'
                }
            }
        }
    }
}
