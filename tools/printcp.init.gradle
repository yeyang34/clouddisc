// Temporary Gradle init script (does NOT modify the repo's build.gradle):
// it prints the full Minecraft runtime classpath, which the offline self-checks in
// tools/ need (they use the real VoxelShape/Box classes but must NOT start the game).
//
// NOTE (0.12.9): this file must stay ASCII-only and WITHOUT a UTF-8 BOM.
// Gradle reads init scripts with the platform default encoding on this machine (GBK),
// and a BOM there is a hard syntax error ("Unexpected character: '?' @ line 1, column 1").
//
// Usage:  gradlew -I tools\printcp.init.gradle :printRuntimeCp -q
//         the single line between CPSTART / CPEND is the full classpath.
allprojects { p ->
    p.afterEvaluate {
        if (p.plugins.hasPlugin('java')) {
            p.tasks.register('printRuntimeCp') {
                doLast {
                    println 'CPSTART'
                    println p.sourceSets.main.runtimeClasspath.asPath
                    println 'CPEND'
                }
            }
        }
    }
}
